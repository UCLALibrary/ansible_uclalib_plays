name: Dev Environment
on:
  push:
    branches:
      - master
      - main
      - rg/** #TODO: remove this line. it is for testing only.

env:
  REPO_TEMPLATE_VERSION: "v0.1.0"

jobs:
  update_repo_tempate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 #checkout the current repo's code
      - uses: actions/checkout@v6 #checkout the repo_template repo's code
        with:
          repository: UCLALibrary/repo_template
          path: repo_template
          ref: ${{ env.REPO_TEMPLATE_VERSION }}
          ssh-key: ${{ secrets.DEV_ENV_REPO_TEMPLATE_PRIVATE_KEY }}
      - name: "Update template"
        env:
          #DEV_ENV_REPO_TEMPLATE_PRIVATE_KEY: ${{ secrets.DEV_ENV_REPO_TEMPLATE_PRIVATE_KEY }}
          #GIT_SSH_COMMAND: ssh -i
        run: |
          #ssh-add - << "$DEV_ENV_REPO_TEMPLATE_PRIVATE_KEY"
          cp -a ./repo_template/ ./
          rm -rf ./repo_template #remove the clone of repo_template before committing
          git config user.name "github-actions[bot]"
          git config user.email "dummy@library.ucla.edu"
          git config
          git add .
          git commit -m "Merge version ${REPO_TEMPLATE_VERSION} of repo-template"
          git push

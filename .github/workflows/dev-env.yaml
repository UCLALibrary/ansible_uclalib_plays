  # in the organization-wide action-variable change the following `key: value`
  # pair to a value of "v1.2.3", where 1.2.3 is your desired version.
  DEV_REPO_TEMPLATE_VERSION: ${{ vars.DEV_REPO_TEMPLATE_VERSION }}


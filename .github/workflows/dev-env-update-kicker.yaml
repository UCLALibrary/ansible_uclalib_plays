name: Dev Environment
on:
  #schedule:
  #  - cron: "00 02 * * 1" #at 02:00 every Monday morning
  push:
    branches:
      - rg/**

env:
  # To uncouple this repo's DEV_REPO_TEMPLATE_VERSION from the value specified
  # in the organization-wide action-variable create a repository-level
  # action-variable with the same name and set it to "v1.2.3", where 1.2.3 is
  # your desired version.
  DEV_REPO_TEMPLATE_VERSION: ${{ vars.DEV_REPO_TEMPLATE_VERSION }}
  GH_TOKEN: ${{ secrets.DEV_REPO_TEMPLATE_AUTOMATION_GH_TOKEN }}
jobs:
  update_repo_tempate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 #checkout the current repo's code
        with:
          fetch-depth: 0
          ref: 'master'
      - name: "Update template"
        run: |
          if [[ -f .dev_repo_template_version ]]; then
            current_dev_repo_template_version="$(cat .dev_repo_template_version)"
          else
            current_dev_repo_template_version="v0.0.0"
          fi
          if [[ "${current_dev_repo_template_version}" != "${DEV_REPO_TEMPLATE_VERSION}" ]]; then
            git config set user.name "github-actions[bot]"
            git config set user.email "dummy@library.ucla.edu"
            git status
            git checkout -b "dev_env_template_update/${DEV_REPO_TEMPLATE_VERSION}" #the name dev_env_template_update is a "magic-string" that triggers the update
            git commit --allow-empty -m "Empty commit: trigger an update of the dev_repo_template"
            git push --set-upstream origin "dev_env_template_update/${DEV_REPO_TEMPLATE_VERSION}"
            gh pr create --title '[scripted] update to latest dev_repo_template' --body "This PR is generated by a scheduled GitHub workflow. See the dev_env_template README.md for more information."
          else
            printf "NOTICE: this repository is already running the latest version of the dev_repo_template.\n"
          fi

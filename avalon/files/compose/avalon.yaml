---
name: avalon

services:
  avalon:
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "0.50"
          memory: 500M
    extends:
      file: base.yaml
      service: avalon

  redis:
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "0.50"
          memory: 20M
    extends:
      file: base.yaml
      service: redis

  worker:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 14G
        reservations:
          cpus: "0.50"
          memory: 500M
    extends:
      file: base.yaml
      service: worker

volumes:
  assets:
  builds:
  masterfiles:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/masterfiles
  streaming:
    driver: local
    driver_opts:
      type: nfs
      o: addr=avalon.in.library.ucla.edu,rw,nfsvers=3
      device: ":/streaming_derivatives/test"
  storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/storage

---

- name: Restart Containers
  hosts: avalon
  become: true

  tasks:
    # docker_compose module requires docker python module, which isn't
    # available on RHEL 8
    - name: Stop Containers
      command:
        cmd: docker compose down --remove-orphans
      changed_when: true
      become: true
      become_user: '{{ item }}'
      loop: '{{ docker_users }}'

    - name: Quiesce Host
      pause:
        prompt: Pausing for host to quiesce
        seconds: 5

    - name: Start Containers
      command:
        cmd: docker compose up --detach
      changed_when: true
      become: true
      become_user: '{{ item }}'
      loop: '{{ docker_users }}'
